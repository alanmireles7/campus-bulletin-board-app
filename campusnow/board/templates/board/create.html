<!DOCTYPE html>
<html>
<head>
    <title>Create Post - CampusNOW</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background: #f4f4f4; }
        .header { background: #f47c20; padding: 15px; text-align: center; color: white; }
        .header h1 { margin: 0; font-size: 28px; }
        .container { max-width: 850px; margin: 40px auto; padding: 20px; }
        .card { background: white; padding: 25px; border-radius: 14px; box-shadow: 0 4px 14px rgba(0,0,0,0.08); }
        .form-group { display: flex; flex-direction: column; margin-bottom: 16px; }
        label { font-weight: bold; margin-bottom: 6px; }
        input, textarea, select { padding: 12px; border-radius: 8px; border: 1px solid #ccc; font-size: 14px; }
        input:focus, textarea:focus, select:focus { outline: none; border-color: #f47c20; }
        textarea { min-height: 120px; resize: vertical; }
        .btn { padding: 10px 20px; background: #f47c20; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; }
        .back { display: inline-block; margin-top: 16px; color: #333; text-decoration: none; }
        .footer { text-align: center; padding: 20px; color: #666; font-size: 14px; }
    </style>
</head>
<body>
    <div class="header"><h1>🏫 CampusNOW</h1></div>
    <div class="container">
        <div class="card">
            <h2>Create a Post</h2>
            <form method="POST">
                {% csrf_token %}
                <div class="form-group">
                    <label>Title</label>
                    <input type="text" name="title" placeholder="e.g. Study group tonight at 7pm" required>
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select name="category" required>
                        <option value="Study Groups">📚 Study Groups</option>
                        <option value="Events">🎉 Events</option>
                        <option value="Housing">🏠 Housing</option>
                        <option value="Clubs">⭐ Clubs</option>
                        <option value="General">📌 General</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Content</label>
                    <textarea name="content" placeholder="Share the details..." required></textarea>
                </div>
                <button type="submit" class="btn">Submit Post</button>
            </form>
            <a href="{% url 'index' %}" class="back">← Back to Home</a>
        </div>
    </div>
    <div class="footer">CampusNOW • Made for UTRGV students • Spring 2026</div>
</body>
</html>
